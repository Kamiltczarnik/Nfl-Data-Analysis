    - "gsis_id"
    - "espn_id"
    - "pfr_id"
    - "pff_id"
    - "sportradar_id"
    - "name"
    - "position"
    - "team"
  
  starters:
    - "season"
    - "week"
    - "team"
    - "position"
    - "player_id"
    - "is_starter"
    - "source"
    - "as_of"

# Starter mapping configuration
starter_mapping:
  # Priority order for determining starters
  priority_order:
    - "depth_chart"
    - "snaps"
    - "override"
  
  # Position groups for starter determination
  position_groups:
    offense:
      - "QB"
      - "RB"
      - "WR"
      - "TE"
      - "FB"
      - "OT"
      - "OG"
      - "C"
    defense:
      - "CB"
      - "S"
      - "LB"
      - "DT"
      - "DE"
      - "NT"
    special_teams:
      - "K"
      - "P"
      - "LS"

# Injury scoring configuration
injury_scoring:
  # Position group priority (higher = more important)
  position_priority:
    QB: 10
    OT: 9
    WR: 8
    CB: 7
    S: 6
    RB: 5
    LB: 4
    DT: 3
    DE: 3
    TE: 2
    FB: 1
  
  # Injury status scoring
  status_scores:
    out: 0.0
    doubtful: 0.25
    questionable: 0.5
    probable: 0.75
    active: 1.0
  
  # Practice status scoring
  practice_scores:
    did_not_participate: 0.0
    limited: 0.5
    full: 1.0

# Data validation rules
validation:
  # Numeric ranges for validation
  ranges:
    spread_line:
      min: -30.0
      max: 30.0
    
    total_line:
      min: 20.0
      max: 80.0
    
    moneyline:
      min: -1000.0
      max: 1000.0
    
    epa:
      min: -10.0
      max: 10.0
    
    wp:
      min: 0.0
      max: 1.0
    
    cp:
      min: 0.0
      max: 1.0
  
  # Required non-null percentages
  non_null_thresholds:
    schedules: 0.95
    pbp: 0.90
    weekly: 0.85
    rosters: 0.90
    injuries: 0.80
  
  # Performance thresholds (realistic for NFL)
  performance_thresholds:
    log_loss_max: 0.66
    brier_score_max: 0.23
    calibration_slope_min: 0.8
    calibration_slope_max: 1.2
  # Team abbreviation validation
  valid_teams:
    - "ARI"
    - "ATL"
    - "BAL"
    - "BUF"
    - "CAR"
    - "CHI"
    - "CIN"
    - "CLE"
    - "DAL"
    - "DEN"
    - "DET"
    - "GB"
    - "HOU"
    - "IND"
    - "JAX"
    - "KC"
    - "LV"
    - "LAC"
    - "LAR"
    - "MIA"
    - "MIN"
    - "NE"
    - "NO"
    - "NYG"
    - "NYJ"
    - "PHI"
    - "PIT"
    - "SF"
    - "SEA"
    - "TB"
    - "TEN"
    - "WAS"

# Early-down filter configuration
early_down:
  # Down numbers to include (1st and 2nd down)
  downs: [1, 2]
  
  # Score differential threshold (within 7 points)
  score_diff_max: 7
  
  # Quarters to include (Q1-Q3)
  quarters: [1, 2, 3]

# Success rate definition
success:
  # EPA threshold for success
  epa_threshold: 0.0

# Explosive play definition
explosive:
  # Yards gained threshold
  yards_threshold: 20
  
  # EPA threshold (alternative)
  epa_threshold: 0.6

# Position group weights for injury scoring
injury_weights:
  QB: 1.0
  OT: 0.9
  WR: 0.8
  CB: 0.8
  S: 0.7
  RB: 0.6
  LB: 0.6
  DT: 0.5
  DE: 0.5
  TE: 0.4
  FB: 0.3

# Weather thresholds
weather:
  wind_high: 15.0  # mph
  temp_cold: 32.0  # fahrenheit
  temp_hot: 85.0   # fahrenheit
  precip_heavy: 0.5  # inches

