# Feature engineering configuration
# This file defines feature selection, window parameters, and validation rules

# Rolling window configurations
windows:
  # Last N games windows
  l3: 3
  l5: 5
  l6: 6
  
  # Exponentially weighted moving average
  ewma:
    alpha: 0.8
    min_periods: 2
  
  # Early season handling when weeks < window size
  early_season:
    min_weeks_for_window: 2
    shrinkage_factor: 0.5

# Feature families for ablation studies
feature_families:
  market:
    - "spread_close"
    - "total_close" 
    - "moneyline_close"
  
  rolling_offense:
    - "off_epa_play_l3"
    - "off_pass_epa_l3"
    - "off_run_epa_l3"
    - "off_success_l3"
    - "early_down_pass_epa_l3"
  
  rolling_defense:
    - "def_epa_play_allowed_l3"
    - "def_pass_epa_allowed_l3"
    - "def_run_epa_allowed_l3"
    - "def_success_allowed_l3"
  
  strategy:
    - "proe_l5"
    - "early_down_pass_rate_l5"
  
  qb:
    - "qb_epa_cpoe_l6"
    - "adot_l5"
  
  trenches:
    - "pressure_allowed_l5"
    - "pressure_created_l5"
    - "sack_rate_oe_l5"
  
  situational:
    - "rest_days"
    - "short_week"
    - "primetime"
    - "roof"
    - "surface"
  
  weather:
    - "wx_temp_f"
    - "wx_wind_mph"
    - "wx_precip"
  
  injuries:
    - "inj_out_count"
    - "inj_q_count"
    - "ol_continuity_index"

# Required columns for each data source
required_columns:
  schedules:
    - "game_id"
    - "season"
    - "week"
    - "home_team"
    - "away_team"
    - "spread_line"
    - "total_line"
    - "moneyline"
  
  pbp:
    # Core play identification
    - "game_id"
    - "play_id"
    - "posteam"
    - "defteam"
    - "season"
    - "week"
    - "quarter"
    - "drive"
    
    # Core metrics
    - "epa"
    - "wp"
    - "cp"
    - "down"
    - "distance"
    - "yardline_100"
    - "score_differential"
    - "game_seconds_remaining"
    - "posteam_score"
    - "defteam_score"
    
    # Play type and context
    - "pass"
    - "rush"
    - "play_type"
    - "desc"
    
    # Offensive player identification (for matchup analysis)
    - "passer_player_id"
    - "passer_player_name"
    - "receiver_player_id"
    - "receiver_player_name"
    - "rusher_player_id"
    - "rusher_player_name"
    
    # Defensive player identification (for matchup analysis)
    - "sack_player_id"
    - "sack_player_name"
    - "qb_hit_1_player_id"
    - "qb_hit_1_player_name"
    - "qb_hit_2_player_id"
    - "qb_hit_2_player_name"
    - "interception_player_id"
    - "interception_player_name"
    
    # Tackle identification (for matchup analysis)
    - "solo_tackle_1_player_id"
    - "solo_tackle_1_player_name"
    - "solo_tackle_2_player_id"
    - "solo_tackle_2_player_name"
    - "assist_tackle_1_player_id"
    - "assist_tackle_1_player_name"
    - "assist_tackle_2_player_id"
    - "assist_tackle_2_player_name"
    
    # Pass defense (for matchup analysis)
    - "pass_defense_1_player_id"
    - "pass_defense_1_player_name"
    - "pass_defense_2_player_id"
    - "pass_defense_2_player_name"
    
    # Play outcomes (for matchup analysis)
    - "air_yards"
    - "pass_location"
    - "yards_gained"
    - "pass_touchdown"
    - "rush_touchdown"
    - "interception"
    - "sack"
    - "qb_hit"
    - "qb_scramble"
  
  weekly:
    - "player_id"
    - "team"
    - "season"
    - "week"
    - "position"
  
  rosters:
    - "season"
    - "team"
    - "position"
    - "gsis_id"
    - "full_name"
    - "status"
    - "week"
  
  injuries:
    - "season"
    - "team"
    - "week"
    - "gsis_id"
    - "position"
    - "full_name"
    - "report_status"
